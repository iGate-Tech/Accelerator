services:
  app:
    build: .
    expose:
      - "4000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
    volumes:
      - sessions_data:/app/sessions
    networks:
      - accelerator-network
    restart: unless-stopped

volumes:
  sessions_data:

networks:
  accelerator-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8::/32
