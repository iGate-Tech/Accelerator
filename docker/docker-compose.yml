version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: accelerator-${CONTAINER_NAME_SUFFIX:-prod}
    ports:
      - '${APP_PORT:-3002}:${PORT:-3000}'
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
      - PORT=${PORT:-3000}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - CONTAINER_NAME_SUFFIX=${CONTAINER_NAME_SUFFIX:-prod}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/app/ssl/key.pem}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/app/ssl/cert.pem}
    volumes:
      - ./ssl:/app/ssl:ro
    networks:
      - accelerator-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  accelerator-network:
    driver: bridge
