version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: accelerator-${CONTAINER_NAME_SUFFIX:-prod}
    ports:
      - '${APP_PORT:-3002}:${PORT:-3001}'
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
      - PORT=${PORT:-3001}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - CONTAINER_NAME_SUFFIX=${CONTAINER_NAME_SUFFIX:-prod}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/app/ssl/key.pem}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/app/ssl/cert.pem}
    volumes:
      - ./ssl:/app/ssl:ro
    networks:
      - accelerator-network
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:${PORT:-3001}/api/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.accelerator.rule=Host(`os.igate.sa`) || Host(`www.os.igate.sa`)'
      - 'traefik.http.routers.accelerator.entrypoints=https'
      - 'traefik.http.routers.accelerator.tls.certresolver=letsencrypt'
      - 'traefik.http.services.accelerator.loadbalancer.server.port=${PORT:-3001}'
      - 'traefik.http.routers.accelerator-http.rule=Host(`os.igate.sa`) || Host(`www.os.igate.sa`)'
      - 'traefik.http.routers.accelerator-http.entrypoints=http'
      - 'traefik.http.routers.accelerator-http.middlewares=redirect-to-https'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'

networks:
  accelerator-network:
    driver: bridge
  dokploy-network:
    external: true
