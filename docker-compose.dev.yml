version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"  # Vite dev server port
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
    volumes:
      - .:/app
      - /app/node_modules
      # Mount .env file for environment variables
      - ./.env:/app/.env:ro
    depends_on:
      - backend
      - supabase
    networks:
      - accelerator-network
    command: npm run dev:vite

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    expose:
      - "3000"  # Express server port
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      # Mount .env file for environment variables
      - ./.env:/app/.env:ro
    depends_on:
      - supabase
    networks:
      - accelerator-network
    command: npm run dev:server

  supabase:
    image: supabase/postgres:15.1.0.147
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase_data:/var/lib/postgresql/data
    networks:
      - accelerator-network



volumes:
  supabase_data:

networks:
  accelerator-network:
    driver: bridge