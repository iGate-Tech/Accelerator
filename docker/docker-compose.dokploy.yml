version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: accelerator-${CONTAINER_NAME_SUFFIX:-prod}
    ports:
      - '${APP_PORT:-3001}:${PORT:-3001}'
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
      - PORT=${PORT:-3001}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - CONTAINER_NAME_SUFFIX=${CONTAINER_NAME_SUFFIX:-prod}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/app/ssl/key.pem}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/app/ssl/cert.pem}
    volumes:
      - ./ssl:/app/ssl:ro
    networks:
      - accelerator-network
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${PORT:-3001}/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      # Enable Traefik
      - 'traefik.enable=true'

      # Network configuration
      - 'traefik.docker.network=dokploy-network'

      # HTTPS Router - Replace your-domain.com with your actual domain
      - 'traefik.http.routers.accelerator.rule=Host(`your-domain.com`)'
      - 'traefik.http.routers.accelerator.entrypoints=https'
      - 'traefik.http.routers.accelerator.tls.certresolver=letsencrypt'

      # Service configuration - Container port must match PORT env var
      - 'traefik.http.services.accelerator.loadbalancer.server.port=${PORT:-3001}'

      # HTTP Router with redirect to HTTPS
      - 'traefik.http.routers.accelerator-http.rule=Host(`your-domain.com`)'
      - 'traefik.http.routers.accelerator-http.entrypoints=http'
      - 'traefik.http.routers.accelerator-http.middlewares=redirect-to-https'

      # HTTPS Redirect Middleware
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true'

networks:
  accelerator-network:
    driver: bridge
  dokploy-network:
    external: true
