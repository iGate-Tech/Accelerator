<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00a7e0">
    <meta name="description" content="AI-powered startup accelerator tool">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iGate OS">
    <meta name="mobile-web-app-capable" content="yes">
    <title>iGate OS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- <link rel="apple-touch-icon" href="/avatar.png"> -->

    <script>
      // Apply theme as early as possible to prevent flash of unstyled content
      (function() {
        // Get saved theme from localStorage or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';

        // Determine actual theme based on user preference
        let actualTheme = savedTheme;
        if (savedTheme === 'auto') {
          // Check system preference
          actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        // Apply the theme to the document element
        document.documentElement.setAttribute('data-theme', actualTheme);

        // Listen for system theme changes if using auto theme
        if (savedTheme === 'auto' && window.matchMedia) {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addEventListener('change', function(e) {
            if (localStorage.getItem('theme') === 'auto') {
              const newTheme = e.matches ? 'dark' : 'light';
              document.documentElement.setAttribute('data-theme', newTheme);
            }
          });
        }
      })();
    </script>

  </head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
