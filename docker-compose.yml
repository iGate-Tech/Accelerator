version: '3.8'

services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000

    volumes:
      # Mount .env file for environment variables
      - ./.env:/app/.env:ro
    networks:
      - accelerator-network

networks:
  accelerator-network:
    driver: bridge